name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # net9.0: host MyDevil (FreeBSD) ma runtime 8/9 — patrz README → Wdrożenie
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FieldReport.Api.sln

      - name: Build
        run: dotnet build FieldReport.Api.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test FieldReport.Api.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
