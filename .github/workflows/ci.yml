name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # testy integracyjne działają na prawdziwym PostgreSQL (każda klasa testów tworzy i usuwa własną bazę)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fieldreport
          POSTGRES_PASSWORD: fieldreport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldreport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIELDREPORT_TEST_DB: Host=localhost;Username=fieldreport;Password=fieldreport
    steps:
      - uses: actions/checkout@v5

      # net9.0: host MyDevil (FreeBSD) ma runtime 8/9 — patrz README → Wdrożenie
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore FieldReport.Api.slnx

      - name: Build
        run: dotnet build FieldReport.Api.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test FieldReport.Api.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
